[tool.poetry]
name = "ml-project-starter"
version = "0.1.0"
description = "Production-grade ML project starter scaffold"
authors = ["Copilot <copilot@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pandas = "^2.2.2"
scikit-learn = "^1.5.1"
xgboost = "^2.1.1"
lightgbm = "^4.0.0"
scipy = "^1.14.0"
joblib = "^1.3.2"
mlflow = "^2.14.0"
optuna = "^3.6.0"
streamlit = "^1.37.0"
plotly = "^5.17.0"
supabase = "^2.9.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
black = "^24.8.0"
ruff = "^0.6.4"
mypy = "^1.11.1"
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
